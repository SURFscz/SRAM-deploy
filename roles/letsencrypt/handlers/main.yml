---
- name: renew letsencrypt certificates
  vars:
    host: "{% if item is mapping %}{{ item | first }}{% else %}{{ item }}{% endif %}"
    sans: "{% if item is mapping %}{% for key,value in item.items() %}{{ key }},{{ value | join(',') }}{% endfor %}{% else %}{{item}}{% endif %}"
  ansible.builtin.command:
    cmd: >
      /usr/bin/certbot certonly --noninteractive
                                {% if letsencrypt_server is defined %}
                                  --server '{{letsencrypt_server}}'
                                {% endif %}
                                --keep-until-expiring
                                --renew-with-new-domains
                                -- cert
                                --cert-name {{host}}
                                --domains {{sans}}
  register: result
  changed_when: "'Certificate is saved at' in result.stdout"
  with_items: "{{ letsencrypt_hosts }}"
  when: "letsencrypt_enabled and letsencrypt_hosts is defined"
  notify: "renew letsencrypt certificates again"

# we need to renew directly in order to run the post renewal hooks...
- name: renew letsencrypt certificates again
  vars:
    host: "{% if item is mapping %}{{ item | first }}{% else %}{{ item }}{% endif %}"
    sans: "{% if item is mapping %}{% for key,value in item.items() %}{{ key }},{{ value | join(',') }}{% endfor %}{% else %}{{item}}{% endif %}"
  ansible.builtin.command:
    cmd: >
      /usr/bin/certbot renew --noninteractive
                             {% if letsencrypt_server is defined %}
                               --server '{{letsencrypt_server}}'
                             {% endif %}
                             --no-random-sleep-on-renew
                             --force-renewal
                             --cert-name {{host}}
                             --domains {{sans}}
  register: result
  changed_when: '"Congratulations, all renewals succeeded" in result.stdout'
  when: "letsencrypt_enabled and letsencrypt_hosts is defined"
  with_items: "{{ letsencrypt_hosts }}"
