---
# playbook to install and configure general components of Apache
- name: Install apache
  apt:
    state: present
    name:
      - apache2

- name: Replace ports.conf
  template:
    src: "ports.conf.j2"
    dest: "/etc/apache2/ports.conf"
  notify: "restart apache"


- name: Install custom logformats
  template:
    src: "logformat.conf.j2"
    dest: "/etc/apache2/conf-enabled/sram-logformat.conf"
  notify: "restart apache"

# Apache mpm modules need to be handled separately, see
- name: Change apache worker
  apache2_module:
    name: "{{ item.key }}"
    state: "{{ item.value }}"
    ignore_configcheck: True
  with_dict:
    mpm_event: "absent"
    mpm_prefork: "present"
  notify: "restart apache"
  failed_when: false

- name: Enable correct apache modules
  apache2_module:
    name: "{{ item.key }}"
    state: "{{ item.value }}"
    ignore_configcheck: true
  with_dict:
    status: "present"
    cgid: "present"
    cgi: "present"
    actions: "present"
    alias: "present"
    rewrite: "present"
    authn_core: "present"
    authz_user: "present"
    ssl: "present"
    headers: "present"
  notify: "restart apache"
  failed_when: false

